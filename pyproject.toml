[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-angel"
version = "0.1.0"
description = "Guardian Angel — incident command console for mass-casualty triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "jinja2>=3.1.0,<4",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "python-dotenv>=1.0.0,<2",
  "firebase-admin>=6.5.0,<7",
  "httpx>=0.27.0,<1",
  "pillow>=11.0.0,<12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian_angel*"]

[tool.setuptools.package-data]
guardian_angel = ["templates/**/*.html", "static/**/*"]

# Dependency lockfile: run `uv lock` after editing [project].dependencies above.
